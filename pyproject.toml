# PyPI packaging for the cudabom CLI.
#
# cudabom is a pure-Rust command-line tool, not a Python library. This file
# lets maturin build a binary wheel whose only payload is the compiled
# `cudabom` executable, dropped into the environment's scripts directory. The
# result is that `pip install cudabom` makes the `cudabom` command available on
# PATH, matching the crates.io, Homebrew, and Snap channels.
#
# Publishing uses PyPI Trusted Publishing (OIDC) from the release workflow; no
# API token is stored. See .github/workflows/release.yml (publish-pypi).

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "cudabom"
description = "Find the CUDA your SBOM missed: evidence-backed CUDA identity and security-grade SBOM/VEX for artifacts."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [{ name = "Chris Peoples" }]
keywords = ["security", "sbom", "cuda", "nvidia", "supply-chain"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Rust",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/cpeoples/cudabom"
Repository = "https://github.com/cpeoples/cudabom"
Documentation = "https://cpeoples.github.io/cudabom/"
Changelog = "https://github.com/cpeoples/cudabom/blob/main/CHANGELOG.md"

[tool.maturin]
# Ship the compiled CLI as a binary wheel (no Python extension module).
bindings = "bin"
manifest-path = "crates/cudabom/Cargo.toml"
# Pull the version from the crate instead of hardcoding it here.
locked = true
strip = true
