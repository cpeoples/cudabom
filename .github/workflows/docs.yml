name: Docs

# Build the documentation site (Hugo + Relearn) from the repo's own docs and
# data, and deploy it to GitHub Pages. The content tree is generated by
# .hugo/scripts/build_docs.py, which also captures `cudabom --help`, so the
# release binary is built first.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - ".hugo/**"
      - "fingerprints/**"
      - "advisories/index.json"
      - "crates/cudabom/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - ".hugo/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUGO_VERSION: "0.167.0"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The Relearn theme is a git submodule under .hugo/themes.
          submodules: recursive
          persist-credentials: false

      - name: Install Hugo (extended)
        run: |
          set -euo pipefail
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSL "$url" -o /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo install /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build cudabom (for the generated CLI reference)
        run: cargo build --release --bin cudabom

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Generate content
        run: python3 .hugo/scripts/build_docs.py

      - name: Build site
        # The production baseURL (the Pages subpath) is injected here rather than
        # hardcoded in hugo.toml, so local `hugo server` serves at the root and
        # only the deployed build carries the subpath.
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url || '/' }}
        run: hugo --source .hugo --minify --baseURL "${HUGO_BASEURL}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: .hugo/public

  deploy:
    name: Deploy to Pages
    # Only publish from the default branch; PRs build (above) but do not deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
