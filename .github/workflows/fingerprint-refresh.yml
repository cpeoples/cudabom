name: fingerprint-refresh

# Keeps the vendored fingerprint database (fingerprints/cuda/*.json) fresh
# against the CUDA redistributables NVIDIA actually publishes.
#
# How it works:
#   - NVIDIA serves an auto-generated directory index at the redist root, so the
#     set of releases is discovered first-party (no hardcoded version list) by
#     `cargo xtask corpus discover`.
#   - Each run takes a bounded batch of NOT-yet-committed releases (BATCH), locks
#     them, downloads and verifies their archives, and derives fingerprint shards
#     in parallel. Coverage fills in progressively across nightly runs rather
#     than pulling every release (tens of GB) in one job.
#   - The downloaded corpus (gitignored, large) is removed at the end so the
#     runner's disk is only ever holding one batch at a time.
#   - When shards change, a pull request is opened for review. A human checks the
#     diff (new components, build-ids, version sets) before merging; scans read
#     the committed, reviewed snapshot offline.

on:
  schedule:
    # Nightly at 05:23 UTC. Off the hour, and offset from advisory-refresh
    # (07:17) so the two data jobs do not contend.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "How many new releases to add this run"
        required: false
        default: "4"
        type: string
      jobs:
        description: "Parallel derivation workers"
        required: false
        default: "4"
        type: string
      heal:
        description: "How many committed shards to re-derive against the current logic this run (self-heal backlog)"
        required: false
        default: "6"
        type: string

concurrency:
  # Key on the trigger so a manual workflow_dispatch and the nightly schedule
  # do not cannibalize each other (static group => the later run self-cancels
  # with cancel-in-progress: false). Two runs of the SAME event still serialize
  # on the shared fingerprint-refresh branch, which is what we want.
  group: fingerprint-refresh-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FIXTURES_DIR: fixtures/redist
  LOCK_DIR: fingerprints
  # Parent of the per-product shard subdirectories (fingerprints/cuda,
  # fingerprints/cudnn, ...). `fingerprints build` writes each product's shards
  # into its own subdir, and the DB loader reads the tree recursively.
  SHARD_DIR: fingerprints
  CORPUS_DIR: corpus

jobs:
  refresh:
    name: Derive new fingerprint shards and open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the branch that carries the updated shards
      pull-requests: write # open the review PR
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Persist REFRESH_PAT as the git/actor credential for the WHOLE run.
          # This is what makes scheduled runs behave like workflow_dispatch:
          # the fine-grained PAT (not the schedule's integration GITHUB_TOKEN)
          # is unambiguously the actor that create-pull-request uses for its
          # server-side signed-commit API calls (createTree/createCommit/
          # createRef). Without this, schedule runs fail at create-a-reference
          # with "Resource not accessible by personal access token".
          persist-credentials: true
          token: ${{ secrets.REFRESH_PAT }}

      - name: Pre-flight (verify REFRESH_PAT can write to this repo)
        # Fail fast in seconds if the token is missing/expired/under-scoped,
        # instead of burning ~37m of derivation and only discovering the
        # permission problem at the Open-pull-request step. We check that the
        # PAT can read the repo with write-adjacent permission surfaced in the
        # response; `permissions.push` must be true to create refs + open PRs.
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::REFRESH_PAT secret is empty or not injected into this run."
            exit 1
          fi
          push=$(gh api repos/${{ github.repository }} --jq '.permissions.push' 2>/dev/null || echo "unknown")
          echo "REFRESH_PAT effective push permission: ${push}"
          if [ "${push}" != "true" ]; then
            echo "::error::REFRESH_PAT lacks write (Contents: write + Pull requests: write) on ${{ github.repository }}. Fine-grained PATs must grant these to this repo and be authorized for the resource owner."
            exit 1
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install libarchive-tools (bsdtar for .rpm extraction)
        # The per-distro RPM repos ship .rpm packages; fingerprint derivation
        # extracts them with bsdtar (libarchive), which reads the RPM header and
        # cpio payload natively without rpm2cpio. Hosted ubuntu runners do not
        # always ship bsdtar, so install it explicitly.
        run: |
          set -euo pipefail
          if ! command -v bsdtar >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libarchive-tools
          fi
          bsdtar --version

      - name: Cache cargo registry and build
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Free up runner disk
        # Hosted runners ship with large preinstalled toolchains we do not need;
        # removing them frees ~20-30 GB of headroom for a batch of CUDA archives.
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Discover new releases (bounded batch)
        id: discover
        env:
          BATCH: ${{ inputs.batch || '4' }}
        run: |
          set -euo pipefail
          # Fetch NVIDIA's indexes, save manifests + lockfiles for up to BATCH
          # new releases per tree. --json prints a per-product plan object
          # ({"cuda":{...},"cudnn":{...},...}) used for the PR body and counts.
          plan="$(cargo run --locked --quiet -p xtask -- corpus discover --json --dry-run)"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          # Total new releases across every tree.
          new_count="$(printf '%s' "$plan" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(len(v["new"]) for v in d.values()))')"
          echo "new_count=$new_count" >> "$GITHUB_OUTPUT"

          if [ "$new_count" -eq 0 ]; then
            echo "All redist trees are up to date; nothing to do."
            exit 0
          fi

          # Actually save the bounded batch (manifests + per-release lockfiles)
          # across every tree. --limit is per-tree, so each product advances by
          # up to BATCH releases per run.
          # All CUDA Linux platforms are locked (x86_64 + sbsa/aarch64 +
          # ppc64le) so the derived DB carries exact inner-.so hashes for
          # non-x86_64 binaries too, not just a structural "likely".
          cargo run --locked --quiet -p xtask -- corpus discover --limit "$BATCH" \
            --platform linux-x86_64 --platform linux-sbsa \
            --platform linux-ppc64le --platform linux-aarch64

      - name: Discover Jetson (L4T/JetPack) CUDA packages
        id: jetson
        run: |
          set -euo pipefail
          # Jetson modules run Linux (L4T/JetPack), and their CUDA stack ships as
          # Debian packages whose Tegra aarch64 binaries have distinct build-ids
          # and inner-.so hashes from the generic linux-sbsa redistributables.
          # Synthesize a redist-shaped manifest + lock for each supported JetPack
          # release from NVIDIA's signed APT index (version, pool path, and
          # SHA-256 straight from the source). These land under
          # fixtures/redist/jetson and fingerprints/jetson, so the fetch, derive,
          # orphan-prune, and PR steps below pick them up with the other trees.
          # Re-discovery is idempotent: an unchanged release rewrites identical
          # bytes and produces no diff.
          cargo run --locked --quiet -p xtask -- jetson discover
          # Signal downstream whether a Jetson lock is new or changed this run,
          # so the fetch/derive step runs even when every other tree is current.
          if git status --porcelain --untracked-files=all -- "$LOCK_DIR/jetson" "$FIXTURES_DIR/jetson" \
            | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Discover per-distro CUDA repos (.deb / .rpm packages)
        id: cuda_repos
        env:
          REPOS_BATCH: ${{ inputs.batch || '4' }}
        run: |
          set -euo pipefail
          # Besides the .tar.xz redistributables, NVIDIA ships the same CUDA
          # libraries as per-distro .deb/.rpm packages under
          # compute/cuda/repos/<distro>/<arch>/. Those are separately built
          # binaries with their own build-ids and inner-.so hashes, so a scan
          # of a library from an apt/dnf CUDA install matches only a structural
          # family in the redist corpus, never an exact version. Synthesize a
          # redist-shaped manifest + lock per distro/arch from NVIDIA's own
          # package index (Debian Packages / YUM primary.xml: version, path, and
          # SHA-256 straight from the source), deduplicated by archive sha256 so
          # a binary shared across distros is recorded once. These land under
          # fixtures/redist/cuda-repos and fingerprints/cuda-repos, so the
          # fetch, derive, orphan-prune, and PR steps below pick them up with
          # the other trees. --limit bounds the batch; re-discovery is
          # idempotent (an unchanged target rewrites identical bytes).
          cargo run --locked --quiet -p xtask -- cuda-repos discover --limit "$REPOS_BATCH"
          if git status --porcelain --untracked-files=all -- "$LOCK_DIR/cuda-repos" "$FIXTURES_DIR/cuda-repos" \
            | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and derive the batch
        if: steps.discover.outputs.new_count != '0' || steps.jetson.outputs.changed == 'true' || steps.cuda_repos.outputs.changed == 'true'
        env:
          JOBS: ${{ inputs.jobs || '4' }}
        run: |
          set -euo pipefail
          # The discover step above saved a lock and manifest for this run's
          # new releases only. Fetch and derive just those, not the whole
          # committed corpus: the lock dir holds every release ever locked, so a
          # blanket fetch would re-download the full multi-tree corpus (hundreds
          # of archives, tens of GB) every night to derive a handful of shards.
          #
          # The newly saved locks are exactly the lockfiles git now sees under
          # the lock dir. Use --untracked-files=all: without it, git collapses a
          # brand-new directory with no tracked files (e.g. fingerprints/
          # cuquantum/ on its first release) to a single
          # "fingerprints/cuquantum/" entry, so the per-file grep below matches
          # nothing and that whole tree is silently skipped. With =all, git
          # lists every file inside new dirs, so new trees are handled the same
          # as existing ones. cut -c4- drops the 2-col status + space so paths
          # are read exactly. Each lock's manifest is resolved below.
          mapfile -t new_locks < <(git status --porcelain --untracked-files=all -- "$LOCK_DIR" \
            | cut -c4- | grep -E '(^|/)corpus\..*\.lock\.json$' || true)
          if [ "${#new_locks[@]}" -eq 0 ]; then
            echo "No new locks saved; nothing to fetch."
            exit 0
          fi
          echo "discover saved ${#new_locks[@]} new release lock(s); fetching"

          # Map a release lock to its manifest. A lock is named
          # corpus.<version>.lock.json and lives either at the fixtures root
          # (CUDA toolkit) or under a sibling product dir; its manifest is the
          # redistrib_<version>.json beside it in $FIXTURES_DIR. Resolving the
          # manifest from the lock lets each release be fetched, derived, and
          # pruned on its own, so peak disk is one release rather than the whole
          # batch (a 20-wide batch hitting cuDNN overran the runner otherwise).
          manifest_for_lock() {
            local lock="$1" rel product version
            rel="${lock#"$LOCK_DIR"/}"            # corpus.<v>.lock.json or <product>/corpus.<v>.lock.json
            version="${rel##*/}"; version="${version#corpus.}"; version="${version%.lock.json}"
            case "$rel" in
              */*) product="${rel%%/*}"; printf '%s/%s/redistrib_%s.json' "$FIXTURES_DIR" "$product" "$version" ;;
              *)   printf '%s/redistrib_%s.json' "$FIXTURES_DIR" "$version" ;;
            esac
          }

          # Stage one manifest into a build tree, mirroring the layout
          # `fingerprints build` expects: siblings keep their product subdir;
          # a CUDA root manifest goes under cuda/ so its shard lands in
          # fingerprints/cuda. Echoes the staging dir for the caller to build
          # from and remove.
          stage_manifest() {
            local m="$1" rel staging
            rel="${m#"$FIXTURES_DIR"/}"
            case "$rel" in
              */*) ;;               # sibling: already under <product>/
              *) rel="cuda/$rel" ;; # cuda root manifest -> cuda/ subdir
            esac
            staging="$(mktemp -d)"
            mkdir -p "$staging/$(dirname "$rel")"
            cp "$m" "$staging/$rel"
            printf '%s' "$staging"
          }

          # Drop a release's lock and manifest when no shard was derived for it
          # (a failed fetch or a manifest that yields nothing): committing the
          # lock/fixture without a usable fingerprint would ship an orphan.
          prune_orphan() {
            local m="$1" rel file version product lock shard
            rel="${m#"$FIXTURES_DIR"/}"
            file="${rel##*/}"
            version="${file#redistrib_}"; version="${version%.json}"
            case "$rel" in
              */*) product="${rel%%/*}"; lock="$LOCK_DIR/$product/corpus.$version.lock.json" ;;
              *)   product="cuda"; lock="$LOCK_DIR/corpus.$version.lock.json" ;;
            esac
            shard="$SHARD_DIR/$product/$file"
            if [ ! -f "$shard" ]; then
              echo "drop orphan $product $version (no shard derived)"
              rm -f "$m" "$lock"
            fi
          }

          # Each release is fetched, derived, and pruned on its own, then its
          # downloaded archives are cleared before the next. One bad upstream
          # archive (an NVIDIA re-publish under a changed hash) is skipped so it
          # does not abort the whole batch; its manifest derives no shard and is
          # pruned as an orphan below.
          for lock in "${new_locks[@]}"; do
            manifest="$(manifest_for_lock "$lock")"
            if [ ! -f "$manifest" ]; then
              echo "skip $lock (no manifest $manifest)"
              continue
            fi
            cargo run --locked --quiet -p xtask -- corpus fetch --lock "$lock" --out "$CORPUS_DIR" \
              || echo "skip $lock (fetch failed; see log above)"
            staging="$(stage_manifest "$manifest")"
            cargo run --locked --quiet -p xtask -- fingerprints build \
              --from "$staging" --out "$SHARD_DIR" --corpus "$CORPUS_DIR" --jobs "$JOBS"
            rm -rf "$staging"
            prune_orphan "$manifest"
            # Flat disk: clear this release's archives before the next release.
            rm -rf "${CORPUS_DIR:?}"/*
          done

      - name: Self-heal stale committed shards (backlog)
        id: heal
        if: ${{ (inputs.heal || '6') != '0' }}
        continue-on-error: true # a heal hiccup must never block the new-release PR
        env:
          HEAL: ${{ inputs.heal || '6' }}
          JOBS: ${{ inputs.jobs || '4' }}
        run: |
          set -euo pipefail
          # Independently of newly discovered releases, re-derive a bounded
          # batch of ALREADY-COMMITTED shards that are stale against the current
          # derivation logic. A shard is stale when its source manifest offers a
          # non-excluded Linux archive whose sha256 is absent from the shard's
          # recorded provenance: a derivable archive it never incorporated (the
          # Model B auto-derivation backlog -- `nvtx`, `opencl`, `sanitizer_api`,
          # folded cuDNN JIT, cuBLASMp `cal`, ... -- or any component added to a
          # release's manifest after the shard was last derived).
          #
          # `backfill` regenerates each release's lock from its manifest with the
          # current all-keys locker (so the missing archives are pinned), fetches
          # ONLY that release across every Linux platform, re-derives ONLY that
          # shard, then reclaims the corpus before the next -- so peak disk stays
          # at one release, exactly like the new-release loop above. The check is
          # content-based and self-terminating: once a shard incorporates the
          # archive, its sha256 lands in provenance and it drops out of the set,
          # so the backlog drains to empty over successive nightly runs and this
          # step becomes a no-op.
          cargo run --locked --quiet -p xtask -- fingerprints backfill \
            --limit "$HEAL" --jobs "$JOBS" --corpus "$CORPUS_DIR"
          # Belt-and-suspenders: backfill reclaims between shards, but ensure the
          # (gitignored) corpus is gone before the diff/PR steps regardless.
          rm -rf "${CORPUS_DIR:?}"/* 2>/dev/null || true

      - name: Regenerate product map from component profiles
        if: steps.discover.outputs.new_count != '0' || steps.jetson.outputs.changed == 'true' || steps.cuda_repos.outputs.changed == 'true' || steps.heal.outcome == 'success'
        # The CSAF product -> component map is generated from the reviewed
        # component profiles (advisory_terms in
        # crates/cudabom-identify/src/derive.rs). Regenerate so that if a newly
        # discovered release prompted a profile addition, the map update rides
        # along in this same review PR rather than drifting until a human
        # notices. A no-op when nothing changed.
        run: cargo run --locked --quiet -p xtask -- product-map --write

      - name: Reclaim disk (drop the downloaded corpus)
        if: always()
        run: |
          set -euo pipefail
          rm -rf "$CORPUS_DIR"
          df -h /

      - name: Detect changes
        id: diff
        if: steps.discover.outputs.new_count != '0' || steps.jetson.outputs.changed == 'true' || steps.cuda_repos.outputs.changed == 'true' || steps.heal.outcome == 'success'
        run: |
          set -euo pipefail
          # Stage new/changed shards and manifests; ignore the gitignored corpus.
          git add "$SHARD_DIR" "$FIXTURES_DIR" "$LOCK_DIR" advisories/product-map.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No shard changes; nothing to open."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Count and list what this run actually committed, not the full
          # backlog discover reported. discover.new_count is every not-yet
          # -committed release across all trees; the bounded --limit batch only
          # locks and derives a slice of that. Title, commit, and body must
          # describe the diff a reviewer sees, so derive them from the staged
          # shard additions (fingerprints/<product>/redistrib_<version>.json).
          mapfile -t added < <(git diff --cached --name-only --diff-filter=A -- "$SHARD_DIR" \
            | grep -E '/redistrib_.*\.json$' \
            | sed -E 's#^fingerprints/([^/]+)/redistrib_(.*)\.json$#\1 \2#' \
            | sort -u)
          # mapfile on empty input yields a zero-length array in bash 4+, but
          # drop any stray empty element defensively so the count is exact.
          tmp=(); for r in "${added[@]}"; do [ -n "$r" ] && tmp+=("$r"); done
          added=("${tmp[@]}")
          added_count="${#added[@]}"
          echo "added_count=$added_count" >> "$GITHUB_OUTPUT"
          # One line per release, grouped for a readable PR body.
          {
            echo 'added<<EOF'
            if [ "$added_count" -eq 0 ]; then
              echo "(no new release shards; non-shard changes only)"
            else
              printf '%s\n' "${added[@]}" | awk '{print "- `"$1"` "$2}'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

          # Self-heal re-derives EXISTING shards, so they appear as MODIFIED
          # (not added). Count/list those separately so the PR title and body
          # reflect the backlog drain distinctly from new releases.
          mapfile -t healed < <(git diff --cached --name-only --diff-filter=M -- "$SHARD_DIR" \
            | grep -E '/redistrib_.*\.json$' \
            | sed -E 's#^fingerprints/([^/]+)/redistrib_(.*)\.json$#\1 \2#' \
            | sort -u)
          # Drop any stray empty element (see the `added` block above).
          tmp=(); for r in "${healed[@]}"; do [ -n "$r" ] && tmp+=("$r"); done
          healed=("${tmp[@]}")
          healed_count="${#healed[@]}"
          echo "healed_count=$healed_count" >> "$GITHUB_OUTPUT"
          {
            echo 'healed<<EOF'
            if [ "$healed_count" -eq 0 ]; then
              echo "(no re-derived shards this run)"
            else
              printf '%s\n' "${healed[@]}" | awk '{print "- `"$1"` "$2}'
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

          # Distinct product trees touched (added + healed), for the title.
          products="$( { printf '%s\n' "${added[@]}"; printf '%s\n' "${healed[@]}"; } \
            | awk 'NF{print $1}' | sort -u | paste -sd', ' -)"
          echo "products=${products:-maintenance}" >> "$GITHUB_OUTPUT"

          # A compact human summary for the PR title: "add N / re-derive M".
          summary=""
          [ "$added_count" -gt 0 ] && summary="add ${added_count} release(s)"
          if [ "$healed_count" -gt 0 ]; then
            [ -n "$summary" ] && summary="${summary}, "
            summary="${summary}re-derive ${healed_count} shard(s)"
          fi
          [ -z "$summary" ] && summary="maintenance"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.REFRESH_PAT }}
          branch: fingerprint-refresh
          base: main
          commit-message: "chore(fingerprints): ${{ steps.diff.outputs.summary }} (${{ steps.diff.outputs.products }})"
          title: "chore(fingerprints): ${{ steps.diff.outputs.summary }} (${{ steps.diff.outputs.products }})"
          add-paths: |
            ${{ env.SHARD_DIR }}
            ${{ env.FIXTURES_DIR }}
            ${{ env.LOCK_DIR }}
            advisories/product-map.json
          delete-branch: true
          sign-commits: true
          body: |
            Automated refresh of the vendored fingerprint database.

            New releases were discovered first-party from NVIDIA's redist
            directory indexes across every product tree (CUDA toolkit + cuDNN,
            NCCL, cuTENSOR, cuDSS, cuSPARSELt, cuQuantum, nvJPEG2000, nvTIFF,
            cuBLASMp, NVPL, NVSHMEM, nvCOMP) plus the Jetson (L4T/JetPack) APT
            packages and the per-distro CUDA repos (compute/cuda/repos:
            Debian/Ubuntu `.deb` and RHEL/Fedora/SLES/Amazon/Azure `.rpm`,
            deduplicated by archive SHA-256), with no hardcoded version list,
            and derived from the official archives (each verified against
            NVIDIA's own SHA-256).

            **Added this run (${{ steps.diff.outputs.added_count }} release(s)):**

            ${{ steps.diff.outputs.added }}

            **Re-derived this run (${{ steps.diff.outputs.healed_count }} shard(s)):**

            Existing committed shards re-derived against the current derivation
            logic (the self-heal backlog). Each had a derivable Linux archive its
            provenance never recorded: typically a Model B auto-derived library
            (`nvtx`, `opencl`, `sanitizer_api`, folded cuDNN JIT, cuBLASMp
            `cal`, ...) or a component added to the release's manifest after the
            shard was last built. The check is content-based and
            self-terminating, so the backlog drains to empty over successive
            nightly runs.

            ${{ steps.diff.outputs.healed }}

            Each nightly adds a bounded batch, so this PR is a slice of the
            remaining backlog, not every discovered release. The full discovery
            snapshot (what each tree has published vs committed) is below for
            context.

            <details><summary>Discovery snapshot (per product tree)</summary>

            ```json
            ${{ steps.discover.outputs.plan }}
            ```

            </details>

            Review the diff of `${{ env.SHARD_DIR }}` for new components,
            build-ids, and version sets before merging. Scans only trust the
            reviewed, committed snapshot.

            If `advisories/product-map.json` changed, it was regenerated from
            the component profiles (`advisory_terms` in
            `crates/cudabom-identify/src/derive.rs`); review it as part of the
            same change.
