name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Formatting, lints, and tests across the platforms we ship on. The spec's
  # acceptance bar is green CI on Linux x86_64 + aarch64 and macOS.
  test:
    name: fmt, clippy, test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            runner: macos-14

    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # No explicit channel: rustup installs exactly what rust-toolchain.toml
        # pins (channel + rustfmt/clippy components), so CI, local, pre-commit,
        # and the .docker/ test image all compile with the same toolchain.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and build
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Smoke-test the CLI
        run: cargo run --release --locked -p cudabom -- version --verbose

  # Supply-chain and hygiene gates. Split from the test matrix so a policy
  # failure is easy to read and only needs to run once.
  hygiene:
    name: deny, machete
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Honor the rust-toolchain.toml pin (see the test job).
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and build
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Product map in sync with component profiles
        # The CSAF product -> component map is generated from advisory_terms in
        # crates/cudabom-identify/src/derive.rs. Fail if the committed file has
        # drifted; regenerate with `cargo xtask product-map --write`.
        run: cargo run --locked --quiet -p xtask -- product-map --check

      - name: Release version pins agree
        # Every internal path-dep version pin in Cargo.toml must equal the
        # workspace package version. Bump them together with
        # `cargo xtask release-version X.Y.Z` (see RELEASING.md).
        run: cargo run --locked --quiet -p xtask -- release-version --check

      - name: Docs (rustdoc intra-doc links)
        # Fail on broken or ambiguous intra-doc links so public API docs stay
        # navigable. Runs once here rather than per-platform in the test matrix.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Install cargo-deny and cargo-machete
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo install --locked cargo-machete@0.9.2

      - name: cargo deny
        run: cargo deny check

      - name: cargo machete (unused dependencies)
        run: cargo machete

  # Release rehearsal: validate the artifacts the Release workflow will publish,
  # on every PR, so a packaging regression is caught long before a tag is cut.
  # crates.io is append-only; a bad publish burns a version number permanently.
  package:
    name: crate packaging (dry run)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo registry and build
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Package the registry-independent crates
        # The leaf crates (no internal path deps) must package and compile in
        # isolation exactly as crates.io will see them. Dependent crates cannot
        # be dry-run packaged here because their internal deps are not on the
        # registry yet; the release workflow publishes bottom-up so each is
        # present by the time its dependents upload. This catches the common
        # publish blockers: missing required manifest fields, files excluded by
        # .gitignore that the build needs, and non-compiling packaged sources.
        run: |
          set -euo pipefail
          for crate in cudabom-core cudabom-fetch cudabom-fatbin; do
            echo "::group::cargo package $crate"
            cargo package -p "$crate" --locked
            echo "::endgroup::"
          done

  # Build the binary wheel maturin will publish to PyPI and prove it installs
  # and runs. Mirrors the Release workflow's build-wheels job on Linux.
  wheel:
    name: python wheel (build + install)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-gnu

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: x86_64-unknown-linux-gnu
          args: --release --out dist --locked
          manylinux: auto

      - name: Install the built wheel and smoke-test the binary
        run: |
          set -euo pipefail
          python3 -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --no-index --find-links dist cudabom
          /tmp/wheeltest/bin/cudabom version --verbose
          /tmp/wheeltest/bin/cudabom schema >/dev/null

  # Short fuzzing smoke run over the parser boundaries that take untrusted
  # input, to catch a regression that reintroduces a panic. Bounded runs only;
  # see fuzz/README.md to run targets locally for longer.
  fuzz:
    name: fuzz parsers (smoke)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install nightly toolchain
        # cargo-fuzz requires nightly for -Z sanitizer=address.
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - name: Cache cargo registry and fuzz build
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fuzz-

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked

      - name: Smoke-fuzz each target
        run: |
          set -euo pipefail
          for t in fuzz_elf fuzz_pe fuzz_fatbin fuzz_csaf fuzz_cyclonedx fuzz_detect; do
            echo "::group::$t"
            cargo +nightly fuzz run "$t" -- -runs=50000 -max_total_time=60
            echo "::endgroup::"
          done
