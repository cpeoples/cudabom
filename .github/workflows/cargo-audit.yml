name: cargo-audit

# Scans the dependency tree against the RustSec advisory database. Runs on
# every push and PR to main, plus weekly so a newly disclosed advisory against
# an already-pinned dependency surfaces even without a code change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "42 6 * * 1"
  workflow_dispatch:

concurrency:
  group: cargo-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: RustSec advisory scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit@0.22.2

      - name: Audit dependencies
        run: cargo audit --deny warnings
