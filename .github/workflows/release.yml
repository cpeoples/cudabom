name: Release

# Builds standalone cudabom binaries for Linux, macOS, and Windows and attaches
# them to the GitHub Release. Trigger by publishing a release for a tag, or run
# manually (workflow_dispatch) to smoke-test the build without uploading.
#
# Provenance: SLSA Build L3 via slsa-github-generator's generic generator
# (trusted reusable workflow), covering every release archive. A CycloneDX
# SBOM is generated from the Cargo dependency graph and, along with the
# archives, signed with Sigstore.
#
# Release flow (see RELEASING.md):
#   1. Merge to main.
#   2. git tag -a vX.Y.Z -m "Release X.Y.Z" && git push origin vX.Y.Z
#   3. GitHub -> Releases -> Draft a new release -> pick the tag -> Publish.
#
#   build (per target) -> aggregate-hashes -> provenance (SLSA L3)
#                      \-> sign-and-attest (SBOM + Sigstore -> release)
#                      \-> publish-crate / bump-tap / publish-snap
#                      \-> build-wheels -> publish-testpypi -> smoke-test
#                                       -> publish-pypi (Trusted Publishing)
#
# A manual workflow_dispatch builds wheels and publishes to TestPyPI only
# (dry run); set publish_pypi=true to also reach production PyPI.
#
# The publish-* jobs only run on a published release and are guarded so a fork
# or a manual dry run can never publish. They no-op cleanly until their
# credentials are provisioned (see RELEASING.md).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to production PyPI (false = TestPyPI dry run only)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The published binary crate. `cargo build -p cudabom` yields `cudabom`.
  BIN_NAME: cudabom
  BIN_PACKAGE: cudabom

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    outputs:
      hashes-x86_64-unknown-linux-gnu: ${{ steps.hash.outputs.hashes-x86_64-unknown-linux-gnu }}
      hashes-aarch64-unknown-linux-gnu: ${{ steps.hash.outputs.hashes-aarch64-unknown-linux-gnu }}
      hashes-aarch64-apple-darwin: ${{ steps.hash.outputs.hashes-aarch64-apple-darwin }}
      hashes-x86_64-apple-darwin: ${{ steps.hash.outputs.hashes-x86_64-apple-darwin }}
      hashes-x86_64-pc-windows-msvc: ${{ steps.hash.outputs.hashes-x86_64-pc-windows-msvc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-2022

    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Honor the rust-toolchain.toml channel pin (as CI does), then add the
        # cross-compilation target's std to *that* toolchain. Installing into a
        # bare `stable` instead would leave the pinned toolchain without the
        # target's std, so cross builds fail with "can't find crate for core".
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p ${{ env.BIN_PACKAGE }}

      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          [ "${{ runner.os }}" = "Windows" ] && bin="${bin}.exe"
          # A cross-compiled binary whose arch differs from the runner host
          # cannot execute here: aarch64 Linux on the amd64 runner, and x86_64
          # macOS on the arm64 macos-14 runner. Skip the run in those cases;
          # build success is the gate, and the matching native target still
          # exercises the binary.
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu) host_arch=x86_64 ;;
            x86_64-apple-darwin) host_arch=arm64 ;;
            *) host_arch="" ;;
          esac
          if [ -n "$host_arch" ] && [ "$(uname -m)" = "$host_arch" ]; then
            echo "skipping run of cross-built $bin on $(uname -m)"
          else
            "$bin" version --verbose
            "$bin" schema >/dev/null
          fi

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # On a release GITHUB_REF_NAME is the tag (e.g. v0.1.0). On a
          # workflow_dispatch dry run it is the branch, which may contain a
          # slash (release/prep-...); sanitize so the archive name is a single
          # path component the upload glob can match.
          version="${GITHUB_REF_NAME:-dev}"
          version="${version//\//-}"
          name="${BIN_NAME}-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp README.md LICENSE NOTICE "dist/${name}/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/${BIN_NAME}.exe" "dist/${name}/"
            (cd dist && 7z a "${name}.zip" "${name}" >/dev/null)
            echo "asset=dist/${name}.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${name}/"
            (cd dist && tar czf "${name}.tar.gz" "${name}")
            echo "asset=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ steps.package.outputs.asset }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" | awk '{print $1}' > "${asset}.sha256"
          else
            shasum -a 256 "$asset" | awk '{print $1}' > "${asset}.sha256"
          fi

      - name: Generate sha256 subject for SLSA provenance
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ steps.package.outputs.asset }}"
          dir=$(dirname "$asset")
          base=$(basename "$asset")
          cd "$dir"
          if command -v sha256sum >/dev/null; then
            subject=$(sha256sum "$base" | base64 | tr -d '\n')
          else
            subject=$(shasum -a 256 "$base" | base64 | tr -d '\n')
          fi
          echo "hashes-${{ matrix.target }}=${subject}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  aggregate-hashes:
    name: Aggregate SLSA subject hashes
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.agg.outputs.hashes }}
    steps:
      - name: Combine per-target hashes
        id: agg
        env:
          H1: ${{ needs.build.outputs.hashes-x86_64-unknown-linux-gnu }}
          H2: ${{ needs.build.outputs.hashes-aarch64-unknown-linux-gnu }}
          H3: ${{ needs.build.outputs.hashes-aarch64-apple-darwin }}
          H4: ${{ needs.build.outputs.hashes-x86_64-apple-darwin }}
          H5: ${{ needs.build.outputs.hashes-x86_64-pc-windows-msvc }}
        run: |
          set -euo pipefail
          {
            [ -n "$H1" ] && echo "$H1" | base64 -d
            [ -n "$H2" ] && echo "$H2" | base64 -d
            [ -n "$H3" ] && echo "$H3" | base64 -d
            [ -n "$H4" ] && echo "$H4" | base64 -d
            [ -n "$H5" ] && echo "$H5" | base64 -d
          } | base64 -w0 > combined.b64
          echo "hashes=$(cat combined.b64)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: aggregate-hashes
    if: github.event_name == 'release'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.aggregate-hashes.outputs.hashes }}"
      provenance-name: "${{ github.event.release.tag_name }}.intoto.jsonl"
      upload-assets: true

  sign-and-attest:
    name: SBOM, sign, and attach
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Honor the rust-toolchain.toml channel pin (see CI).
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx@0.5.9

      - name: Generate CycloneDX SBOM
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || 'sbom' }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          # Spec version 1.6 per the project's SBOM target.
          cargo cyclonedx --format json --spec-version 1.6 --all
          # cargo-cyclonedx writes <crate>.cdx.json next to each manifest; the
          # CLI crate's SBOM is the shipped-binary bill of materials.
          cp crates/cudabom/cudabom.cdx.json "sbom/${RELEASE_TAG}.cdx.json"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: cudabom-*
          merge-multiple: true
          path: dist/

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.zip ./sbom/*.cdx.json

      - name: Attach signed artifacts, SBOM, and signatures to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*.sha256 \
            dist/*.sigstore.json \
            sbom/*.cdx.json \
            sbom/*.sigstore.json \
            --clobber

  data-bundle:
    name: Build and attach the data bundle
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Honor the rust-toolchain.toml channel pin (see CI).
        run: rustup show active-toolchain || rustup toolchain install

      # Package the committed, reviewed data (fingerprint shards + advisory
      # index) into cudabom-data-<tag>.tar.gz plus a .sha256 sidecar. This is the
      # asset `cudabom update` downloads and verifies. Deterministic: a pure
      # function of the committed data and the tag.
      - name: Build data bundle
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: cargo run --locked -p xtask -- bundle --tag "${RELEASE_TAG}" --out dist

      - name: Sign the data bundle with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: ./dist/cudabom-data-*.tar.gz

      - name: Attach the data bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" \
            dist/cudabom-data-*.tar.gz \
            dist/cudabom-data-*.tar.gz.sha256 \
            dist/cudabom-data-*.sigstore.json \
            --clobber

  publish-crate:
    name: Publish to crates.io
    needs: sign-and-attest
    # Disabled until the crate names are approved and CARGO_REGISTRY_TOKEN is
    # set. The workspace publishes bottom-up: cudabom-core first, then the
    # leaf crates, then cudabom. See RELEASING.md.
    if: github.event_name == 'release' && vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Honor the rust-toolchain.toml channel pin (see CI).
        run: rustup show active-toolchain || rustup toolchain install

      - name: Set crate version from the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo install cargo-edit --locked
          cargo set-version "$version"

      - name: Publish workspace in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          for crate in \
            cudabom-core \
            cudabom-fetch \
            cudabom-extract cudabom-elf cudabom-fatbin cudabom-identify \
            cudabom-advisory cudabom-sbom cudabom-report cudabom-policy \
            cudabom; do
            echo "::group::publish $crate"
            cargo publish --locked --allow-dirty -p "$crate"
            echo "::endgroup::"
          done

  bump-tap:
    name: Bump Homebrew tap
    needs: sign-and-attest
    if: github.event_name == 'release' && vars.PUBLISH_HOMEBREW == 'true'
    runs-on: ubuntu-latest
    environment:
      name: homebrew-tap
      url: https://github.com/cpeoples/homebrew-tap/pulls
    permissions:
      contents: read
    env:
      VERSION: ${{ github.event.release.tag_name }}
      FORMULA_PATH: Formula/cudabom.rb

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cpeoples/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false

      - name: Rewrite formula from release checksums
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p checksums
          gh release download "$VERSION" --repo cpeoples/cudabom \
            --pattern "*.tar.gz.sha256" --dir checksums
          python3 - <<'PY'
          import os, re, pathlib
          tag = os.environ["VERSION"]
          targets = [
              "aarch64-apple-darwin",
              "x86_64-apple-darwin",
              "aarch64-unknown-linux-gnu",
              "x86_64-unknown-linux-gnu",
          ]
          sha = {}
          for t in targets:
              p = pathlib.Path("checksums") / f"cudabom-{tag}-{t}.tar.gz.sha256"
              sha[t] = p.read_text().split()[0]
          path = pathlib.Path(os.environ["FORMULA_PATH"])
          src = path.read_text()
          for t in targets:
              src = re.sub(
                  rf'(cudabom-v[^"/]+-{re.escape(t)}\.tar\.gz"\n\s*sha256\s+)"[0-9a-f]{{64}}"',
                  rf'\g<1>"{sha[t]}"',
                  src,
              )
          src = re.sub(r'/download/v[^/]+/cudabom-v[^-]+-', f'/download/{tag}/cudabom-{tag}-', src)
          path.write_text(src)
          PY

      - name: Open pull request on tap
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          commit-message: "cudabom ${{ env.VERSION }}"
          title: "cudabom ${{ env.VERSION }}"
          body: |
            Automated bump triggered by ${{ env.VERSION }} on cpeoples/cudabom.
          branch: bump-cudabom-${{ env.VERSION }}
          delete-branch: true
          add-paths: ${{ env.FORMULA_PATH }}
          sign-commits: true

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --repo cpeoples/homebrew-tap --auto --squash --delete-branch

  publish-snap:
    name: Publish to Snap Store
    needs: sign-and-attest
    if: github.event_name == 'release' && vars.PUBLISH_SNAP == 'true'
    runs-on: ubuntu-latest
    environment:
      name: snapcraft
      url: https://snapcraft.io/cudabom
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve snap version
        run: git describe --tags --always | sed 's/^v//' > snap/.version

      - name: Build snap
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79  # v1.3.0

      - name: Publish to the stable channel
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40  # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  build-wheels:
    name: Build wheel ${{ matrix.target }}
    needs: build
    # Build wheels on a release and on a manual dispatch (for TestPyPI dry
    # runs). The downstream publish jobs decide where the wheels actually go.
    # Depends on `build` (not sign-and-attest) so the dispatch dry-run path is
    # not pruned when the release-only signing job is skipped.
    if: >-
      vars.PUBLISH_PYPI == 'true' &&
      (github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-2022

    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Honor the rust-toolchain.toml channel pin, then add the cross target's
        # std to that toolchain (installing into bare `stable` would leave the
        # pinned toolchain without the target std and fail cross builds).
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Set wheel version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          cargo install cargo-edit --locked
          if [ -n "${RELEASE_TAG:-}" ]; then
            # Real release: version comes from the tag.
            cargo set-version "${RELEASE_TAG#v}"
          else
            # TestPyPI dry run: append a unique dev suffix so the upload never
            # collides with an existing version on the index.
            base="$(cargo pkgid -p cudabom | sed 's/.*[#@]//')"
            cargo set-version "${base}-dev.$(date +%Y%m%d%H%M%S)"
          fi

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --locked
          # manylinux builds run in a container; the native target for the
          # other platforms builds directly on the runner.
          manylinux: ${{ runner.os == 'Linux' && 'auto' || 'off' }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build-wheels
    if: needs.build-wheels.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cudabom/
    permissions:
      # Trusted Publishing (OIDC): the testpypi environment must be registered
      # as a trusted publisher on test.pypi.org for this workflow.
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # idempotent retries

  smoke-test-testpypi:
    name: Smoke test from TestPyPI
    needs: publish-testpypi
    if: needs.publish-testpypi.result == 'success'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-14, windows-2022]

    steps:
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install cudabom from TestPyPI
        shell: bash
        run: |
          set -euo pipefail
          # TestPyPI's index can lag a few seconds behind the upload.
          for i in 1 2 3 4 5; do
            if python -m pip install \
                --index-url https://test.pypi.org/simple/ \
                --extra-index-url https://pypi.org/simple/ \
                cudabom; then
              exit 0
            fi
            echo "install attempt $i failed; retrying in 10s..."
            sleep 10
          done
          exit 1

      - name: Binary runs
        run: cudabom version --verbose

  publish-pypi:
    name: Publish to PyPI
    needs: smoke-test-testpypi
    # Only reach production PyPI on a real release, or on a manual dispatch
    # that explicitly opted in. A plain dispatch stops at the TestPyPI dry run.
    if: >-
      needs.smoke-test-testpypi.result == 'success' &&
      (github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_pypi == true))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cudabom/
    permissions:
      # Trusted Publishing (OIDC): no API token stored. The pypi environment
      # must be registered as a trusted publisher on PyPI for this workflow.
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed  # v2.22.0
        with:
          egress-policy: audit

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist
