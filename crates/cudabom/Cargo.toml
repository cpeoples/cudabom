name = "cudabom"
path = "src/main.rs"

[dependencies]
cudabom-core.workspace = true
cudabom-extract.workspace = true
cudabom-elf.workspace = true
cudabom-pe.workspace = true
cudabom-fatbin.workspace = true
cudabom-identify.workspace = true
cudabom-advisory.workspace = true
cudabom-fetch.workspace = true
cudabom-policy.workspace = true
cudabom-report.workspace = true
cudabom-sbom.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
object = { workspace = true, features = ["write"] }
predicates.workspace = true
sha2.workspace = true
tempfile.workspace = true
zip.workspace = true
