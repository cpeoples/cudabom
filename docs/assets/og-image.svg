    <rect x="21" y="21" width="228" height="228" rx="46" fill="url(#cb-glow)"/>
    <!-- Isometric CUDA-grid cube, scaled from the 128px icon (x2.11 -> 135 center) -->
    <g transform="translate(135 135) scale(2.11)">
      <path d="M0 -40 L40 -17 L0 6 L-40 -17 Z" fill="url(#cb-top)"/>
      <path d="M-40 -17 L0 6 L0 48 L-40 25 Z" fill="url(#cb-left)"/>
      <path d="M40 -17 L0 6 L0 48 L40 25 Z" fill="#3C5F00"/>
      <g stroke="#14161c" stroke-width="2.2" opacity="0.9">
        <path d="M-26.6 -9.7 L13.3 -32.6"/><path d="M-13.3 -2 L26.6 -24.9"/>
        <path d="M-26.6 -24.9 L13.3 -2"/><path d="M-13.3 -32.6 L26.6 -9.7"/>
      </g>
      <g stroke="#14161c" stroke-width="2.2" opacity="0.85">
        <path d="M-26.6 -9.7 L-26.6 17.3"/><path d="M-13.3 -2 L-13.3 25"/>
        <path d="M-40 0 L0 23"/><path d="M-40 12.5 L0 35.5"/>
      </g>
      <g stroke="#14161c" stroke-width="2.2" opacity="0.85">
        <path d="M26.6 -9.7 L26.6 17.3"/><path d="M13.3 -2 L13.3 25"/>
        <path d="M40 0 L0 23"/><path d="M40 12.5 L0 35.5"/>
      </g>
      <g fill="#DFFF8A">
