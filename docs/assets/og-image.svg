<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="CudaBOM: find the CUDA your SBOM missed">
  <defs>
    <linearGradient id="cb-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#141826"/>
    </linearGradient>
    <linearGradient id="cb-rule" x1="410" y1="0" x2="940" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76B900"/>
      <stop offset="1" stop-color="#B6F03A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cb-top" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B6F03A"/><stop offset="1" stop-color="#86CC06"/>
    </linearGradient>
    <linearGradient id="cb-left" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
