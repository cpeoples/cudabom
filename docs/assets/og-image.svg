  <text x="410" y="250" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="150" font-weight="800" letter-spacing="1" fill="#f4f4f5">CudaBOM</text>
  <rect x="414" y="292" width="470" height="5" rx="2.5" fill="url(#cb-rule)"/>
  <text x="416" y="360" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="40" font-weight="600" fill="#c7cfdd">Find the CUDA your SBOM missed</text>
  <text x="416" y="418" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" font-weight="400" fill="#8a93a6">Evidence-backed CUDA identity and security-grade SBOM, VEX,</text>
  <text x="416" y="454" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="27" font-weight="400" fill="#8a93a6">and advisory data for wheels, libraries, and container images.</text>
  <text x="88" y="588" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" font-weight="600" letter-spacing="2" fill="#5a6273">CYCLONEDX  .  VEX  .  SARIF  .  CSAF  .  RUST</text>
