<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="620" height="140" role="img" aria-label="CudaBOM - Find the CUDA your SBOM missed">
  <title>CudaBOM</title>
  <defs>
    <linearGradient id="cb-top" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B6F03A"/><stop offset="1" stop-color="#86CC06"/>
    </linearGradient>
    <linearGradient id="cb-left" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FAE00"/><stop offset="1" stop-color="#4E7A00"/>
    </linearGradient>
    <radialGradient id="cb-glow" cx="64" cy="64" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76B900" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#76B900" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded dark panel so the mark reads on light or dark backgrounds. -->
  <g transform="translate(6 6)">
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#14161c"/>
    <rect x="10" y="10" width="108" height="108" rx="22" fill="url(#cb-glow)"/>

    <!-- Isometric CUDA grid cube (GPU grid-of-blocks / SM-core lattice). -->
    <g transform="translate(64 64)">
      <path d="M0 -40 L40 -17 L0 6 L-40 -17 Z" fill="url(#cb-top)"/>
      <path d="M-40 -17 L0 6 L0 48 L-40 25 Z" fill="url(#cb-left)"/>
      <path d="M40 -17 L0 6 L0 48 L40 25 Z" fill="#3C5F00"/>
      <g stroke="#14161c" stroke-width="2.2" opacity="0.9">
        <path d="M-26.6 -9.7 L13.3 -32.6"/><path d="M-13.3 -2 L26.6 -24.9"/>
        <path d="M-26.6 -24.9 L13.3 -2"/><path d="M-13.3 -32.6 L26.6 -9.7"/>
      </g>
      <g stroke="#14161c" stroke-width="2.2" opacity="0.85">
        <path d="M-26.6 -9.7 L-26.6 17.3"/><path d="M-13.3 -2 L-13.3 25"/>
        <path d="M-40 0 L0 23"/><path d="M-40 12.5 L0 35.5"/>
      </g>
      <g stroke="#14161c" stroke-width="2.2" opacity="0.85">
        <path d="M26.6 -9.7 L26.6 17.3"/><path d="M13.3 -2 L13.3 25"/>
        <path d="M40 0 L0 23"/><path d="M40 12.5 L0 35.5"/>
      </g>
      <g fill="#DFFF8A">
        <circle cx="0" cy="-17" r="2.6"/><circle cx="-13.3" cy="-9.7" r="2.6"/><circle cx="13.3" cy="-9.7" r="2.6"/>
        <circle cx="-13.3" cy="-24.9" r="2.6"/><circle cx="13.3" cy="-24.9" r="2.6"/>
      </g>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <text x="156" y="70" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,monospace" font-size="56" font-weight="700" letter-spacing="2" fill="#f4f4f5">CudaBOM</text>
  <text x="158" y="102" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,monospace" font-size="15" font-weight="500" letter-spacing="2" fill="#9aa4b2">FIND THE CUDA YOUR SBOM MISSED</text>
</svg>
